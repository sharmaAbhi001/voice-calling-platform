<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets below have something to report on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VoiceOps — outbound calling operations console." />
    <meta name="theme-color" content="#1b3a7a" />
    <meta name="color-scheme" content="light" />
    <!-- Installed to a home screen, the app should keep its own header rather than a browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VoiceOps" />
    <!-- An operations console holds customer data; keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>VoiceOps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
