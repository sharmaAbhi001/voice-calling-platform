server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Knowledge-base documents are posted as JSON; the backend accepts up to 2mb.
  client_max_body_size 10m;

  # Same-origin API. The browser only ever talks to this nginx, so the backend
  # port stays closed to the internet, there is no CORS, and the compiled bundle
  # holds a relative "/api" instead of a hostname that changes with the box.
  location /api/ {
    # Docker's embedded DNS, resolved at request time: nginx then starts even
    # when the backend container is not up yet, instead of failing at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;

    # The backend mounts its routers at the root (/auth, /calls, ...), so the
    # /api prefix is stripped before proxying.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_upgrade;
    proxy_read_timeout 120s;
  }

  # Single-page app: unknown paths are routed to the client router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
